<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="shared.css">
    <title>Pokémon</title>
</head>
<body>
    <div class="pokeball"></div>
    <div class="title-container">
        <h1 class="title">⚔️VS</h1>
    </div>
  <div class="controls">
  <nav class="nav-buttons">
    <a class="linkp" href="index.html">
        <button class="nav-btn buscar-nav" >🔍 BUSCAR</button>
        </a>
        <a class="linkp" href="historico.html">
    <button class="nav-btn historico" >📜 HISTÓRICO</button>
    </a>
    <a class="linkp" href="vs.html">
    <button class="nav-btn vs">⚔️ VS</button>
    </a>
    <a class="linkp" href="favoritos.html">
    <button class="nav-btn favoritos">❤️ FAVORITOS</button>
    </a>
  </nav>

    <div>
       <div class="vs-ui">

  <div class="vs-row">
    <input id="vsInput1" class="vs-input" placeholder="POKÉMON 1..." />
    <button id="vsBtn1" class="vs-small-btn" type="button">BUSCAR</button>

    <div class="vs-mid">VS</div>

    <input id="vsInput2" class="vs-input" placeholder="POKÉMON 2..." />
    <button id="vsBtn2" class="vs-small-btn" type="button">BUSCAR</button>
  </div>

  <button id="battleBtn" class="vs-battle-btn" type="button" disabled>⚔️ ¡BATALLAR!</button>

  <div class="vs-cards">
    <!-- Card 1 -->
    <div class="mini-card" id="miniCard1">
      <div class="mini-badge" id="badge1">🌐 API</div>

      <div class="mini-sprite">
        <img id="img1" alt="pokemon 1" />
      </div>

      <div class="mini-title">
        <div class="mini-id" id="id1">#?</div>
        <div class="mini-name" id="name1">---</div>
      </div>

      <div class="mini-types" id="types1"></div>

      <button class="mini-fav" id="fav1">♡</button>
    </div>

    <div class="vs-swords">⚔️</div>

    <!-- Card 2 -->
    <div class="mini-card" id="miniCard2">
      <div class="mini-badge" id="badge2">🌐 API</div>

      <div class="mini-sprite">
        <img id="img2" alt="pokemon 2" />
      </div>

      <div class="mini-title">
        <div class="mini-id" id="id2">#?</div>
        <div class="mini-name" id="name2">---</div>
      </div>

      <div class="mini-types" id="types2"></div>

      <button class="mini-fav" id="fav2">♡</button>
    </div>
  </div>

  <div class="vs-result" id="vsResult"></div>
</div>

<script src="vs.js"></script>
 
    </div>
</body>
</html>
