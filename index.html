<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="shared.css">
</head>
<body>
    <div class="pokeball"></div>
    <div class="title-container">
        <h1 class="title">Pokémon Finder</h1>
    </div>
    <div class="controls">
        <nav class="nav-buttons">
            <button class="nav-btn buscar-nav">🔍 BUSCAR</button>
            <button class="nav-btn historico">📜 HISTÓRICO</button>
            <button class="nav-btn vs">⚔️ VS</button>
            <button class="nav-btn favoritos">❤️ FAVORITOS</button>
            <!-- dropbox -->
        <select class="nav-btn" style="font-size: 48px; font-family: 'Courier New', monospace; font-weight: bold; margin-left: 20px;">
            <option value="" selected disabled>🌎 REGIÓN</option>
            <option value="kanto">Kanto</option>
            <option value="johto">Johto</option>
            <option value="hoenn">Hoenn</option>
            <option value="sinnoh">Sinnoh</option>
            <option value="unova">Unova</option>
            <option value="kalos">Kalos</option>
            <option value="alola">Alola</option>
            <option value="galar">Galar</option>
            <option value="paldea">Paldea</option>
        </select>
        </nav>
    </div>

</html>
